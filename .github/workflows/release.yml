name: Release

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Verify a candidate, publish a reviewed tag, or verify a published release
        type: choice
        options: [verify, publish, verify-install]
        default: verify
        required: true
      version:
        description: Published vX.Y.Z tag (required only for verify-install)
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == '9uiLe/hamio' && github.actor == github.repository_owner && inputs.mode != 'verify-install'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: darwin-arm64
          - runner: ubuntu-24.04
            target: linux-x64
          - runner: ubuntu-24.04-arm
            target: linux-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    outputs:
      tag: ${{ steps.validate.outputs.tag }}
    env:
      HUSKY: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: DeterminateSystems/determinate-nix-action@58b42ef6cd91478a14253e00805ec7c79eb1566a # v3.22.4
        with:
          github-token: ""
          diagnostic-endpoint: ""
      - name: Validate, test and package native executable
        id: validate
        env:
          RELEASE_MODE: ${{ inputs.mode }}
        run: |
          nix develop --no-write-lock-file --command sh -eu -c '
            bun install --frozen-lockfile --ignore-scripts
            bun scripts/release/preflight.ts
            bun audit
            bun run check
            bun run release:verify
          '
          git diff --exit-code
          cat dist/release-verification.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.target }}
          path: dist/release/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verification-${{ matrix.target }}
          path: dist/release-verification.json
          if-no-files-found: error
          retention-days: 30

  attest:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    strategy:
      matrix:
        target: [darwin-arm64, linux-x64, linux-arm64]
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-${{ matrix.target }}
          path: assets
      - name: Attest artifact provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: assets/*
      - name: Bind inventory to compressed executable
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: assets/hamio-${{ needs.build.outputs.tag }}-${{ matrix.target }}.gz
          sbom-path: assets/hamio-${{ needs.build.outputs.tag }}-${{ matrix.target }}.spdx.json

  verify-candidate:
    needs: [build, attest]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: darwin-arm64
          - runner: ubuntu-24.04
            target: linux-x64
          - runner: ubuntu-24.04-arm
            target: linux-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-${{ matrix.target }}
          path: assets
      - name: Verify real provenance and run without development runtimes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
          RELEASE_REF: ${{ github.ref }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: sh scripts/verify-candidate.sh assets

  publish:
    if: inputs.mode == 'publish' && startsWith(github.ref, 'refs/tags/v')
    needs: [build, verify-candidate]
    environment: release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          merge-multiple: true
          path: assets
      - name: Publish immutable release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # The owner checks the admin-only immutable-release setting before approving
          # this environment. GITHUB_TOKEN cannot read that setting. Verify the actual
          # immutable release below before allowing consumer installation tests.
          # A published version is never overwritten. A leftover draft requires inspection.
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo 'Release already exists. Inspect it before retrying; do not replace published assets.' >&2
            exit 1
          fi
          cat > notes.md <<'NOTES'
          Standalone terminal UI for macOS 15 arm64 and Ubuntu 24.04 x64/arm64 (glibc).
          Bun, Node.js and Nix are not required on consumer machines.

          Includes SHA-256 checksums, an SPDX inventory and third-party notices.
          The inventory covers production JavaScript dependencies and Bun as an aggregate, not every native component.
          These platform tests do not guarantee older OS versions, musl, all terminals or every performance budget.
          NOTES
          docs_url="https://github.com/$GH_REPO/blob/$RELEASE_TAG/docs"
          printf '\n[Install, update and rollback](%s/distribution.md) · [API](%s/api.md) · [Validation and limits](%s/release-readiness.md)\n' "$docs_url" "$docs_url" "$docs_url" >> notes.md
          printf '\nValidation run: https://github.com/%s/actions/runs/%s\nSource commit: %s\n' "$GH_REPO" "$GITHUB_RUN_ID" "$GITHUB_SHA" >> notes.md
          gh release create "$RELEASE_TAG" --verify-tag --draft --title "$RELEASE_TAG" --notes-file notes.md --generate-notes assets/*
          gh release edit "$RELEASE_TAG" --draft=false
          gh release verify "$RELEASE_TAG"

  verify-install:
    needs: publish
    if: >-
      always() && github.repository == '9uiLe/hamio' &&
      github.actor == github.repository_owner &&
      (needs.publish.result == 'success' || inputs.mode == 'verify-install')
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - name: Verify and install published release as a consumer
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_MODE: ${{ inputs.mode }}
          VERIFY_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ "$RELEASE_MODE" = verify-install ]; then RELEASE_TAG=$VERIFY_VERSION; fi
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          cd "$RUNNER_TEMP"
          gh release verify "$RELEASE_TAG"
          RELEASE_COMMIT=$(gh api "repos/$GH_REPO/commits/$RELEASE_TAG" --jq .sha)
          printf 'tag=%s\ncommit=%s\n' "$RELEASE_TAG" "$RELEASE_COMMIT" >> "$GITHUB_OUTPUT"
          gh release download "$RELEASE_TAG" --pattern install.sh
          gh release verify-asset "$RELEASE_TAG" install.sh
          gh attestation verify install.sh --repo "$GH_REPO" \
            --signer-workflow "$GH_REPO/.github/workflows/release.yml" \
            --source-ref "refs/tags/$RELEASE_TAG" --source-digest "$RELEASE_COMMIT" --deny-self-hosted-runners
          sh install.sh --version "$RELEASE_TAG" --prefix "$RUNNER_TEMP/consumer/.tools"
          "$RUNNER_TEMP/consumer/.tools/bin/hamio" capabilities
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.release.outputs.commit }}
          persist-credentials: false
      - name: Exercise the consumer action and an independent project
        id: setup
        uses: ./
        with:
          version: ${{ steps.release.outputs.tag }}
      - name: Exercise shell consumers without Bun, Node.js or Nix
        env:
          HAMIO_BINARY: ${{ steps.setup.outputs.binary }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: sh scripts/smoke-consumer.sh "$HAMIO_BINARY" "${RELEASE_TAG#v}"
