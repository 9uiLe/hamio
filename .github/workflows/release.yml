name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == '9uiLe/hamio' && github.actor == github.repository_owner && startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: darwin-arm64
          - runner: ubuntu-24.04
            target: linux-x64
          - runner: ubuntu-24.04-arm
            target: linux-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    env:
      HUSKY: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: DeterminateSystems/determinate-nix-action@1d699fc25db3f9e079cd2f168ca007a4183389be # v3.15.1
        with:
          github-token: ""
          diagnostic-endpoint: ""
      - name: Validate, test and package native executable
        run: |
          nix develop --no-write-lock-file --command sh -eu -c '
            bun install --frozen-lockfile --ignore-scripts
            bun scripts/release/preflight.ts
            bun audit
            bun run check
            bun run release:verify
          '
          git diff --exit-code
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.target }}
          path: dist/release/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  attest:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    strategy:
      matrix:
        target: [darwin-arm64, linux-x64, linux-arm64]
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-${{ matrix.target }}
          path: assets
      - name: Attest artifact provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: assets/*
      - name: Bind inventory to compressed executable
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: assets/hamio-${{ github.ref_name }}-${{ matrix.target }}.gz
          sbom-path: assets/hamio-${{ github.ref_name }}-${{ matrix.target }}.spdx.json

  publish:
    needs: attest
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          merge-multiple: true
          path: assets
      - name: Publish immutable release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GH_REPO/immutable-releases" --jq .enabled)" = true
          # A published version is never overwritten. A leftover draft requires inspection.
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo 'Release already exists. Inspect it before retrying; do not replace published assets.' >&2
            exit 1
          fi
          cat > notes.md <<'NOTES'
          Standalone terminal UI for macOS 15 arm64 and Ubuntu 24.04 x64/arm64 (glibc).
          Bun, Node.js and Nix are not required on consumer machines.

          Install, update and rollback: see docs/distribution.md at this release tag.
          Select an exact version; verify the immutable release and artifact provenance before execution.

          Each platform includes SHA-256 checksums, an SPDX inventory and third-party notices.
          Inventory scope: production JavaScript dependencies and Bun as a hash-pinned aggregate.
          Bun's native component versions are not individually resolved; see the inventory comment and upstream notices.
          These platform tests do not guarantee older OS versions, musl, all terminals or every performance budget.
          NOTES
          gh release create "$RELEASE_TAG" --verify-tag --draft --title "$RELEASE_TAG" --notes-file notes.md --generate-notes assets/*
          gh release edit "$RELEASE_TAG" --draft=false
          gh release verify "$RELEASE_TAG"

  verify-install:
    needs: publish
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - name: Verify and install published release as a consumer
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          gh release verify "$RELEASE_TAG"
          gh release download "$RELEASE_TAG" --pattern install.sh
          gh release verify-asset "$RELEASE_TAG" install.sh
          gh attestation verify install.sh --repo "$GH_REPO" \
            --signer-workflow "$GH_REPO/.github/workflows/release.yml" \
            --source-ref "refs/tags/$RELEASE_TAG" --source-digest "$RELEASE_COMMIT" --deny-self-hosted-runners
          sh install.sh --version "$RELEASE_TAG" --prefix "$RUNNER_TEMP/consumer/.tools"
          "$RUNNER_TEMP/consumer/.tools/bin/hamio" capabilities
