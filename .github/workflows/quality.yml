name: Quality

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      runner:
        description: Environment to validate
        type: choice
        options: [ubuntu-24.04, macos-15]
        default: ubuntu-24.04
        required: true

permissions:
  contents: read

concurrency:
  group: quality-${{ github.event_name }}-${{ github.ref }}-${{ inputs.runner || 'ubuntu-24.04' }}
  cancel-in-progress: true

jobs:
  quality:
    if: >-
      (github.actor == github.repository_owner ||
      (github.actor == 'dependabot[bot]' && github.event_name == 'pull_request')) &&
      (github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ${{ github.event_name == 'workflow_dispatch' && inputs.runner || 'ubuntu-24.04' }}
    timeout-minutes: 20
    env:
      HUSKY: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Nix
        uses: DeterminateSystems/determinate-nix-action@1d699fc25db3f9e079cd2f168ca007a4183389be # v3.15.1
        with:
          github-token: ""
          diagnostic-endpoint: ""
      - name: Validate Nix definitions
        run: nix flake check --all-systems --no-build --no-write-lock-file
      - name: Install dependencies and run checks
        run: |
          nix develop --no-write-lock-file --command sh -eu -c '
            bun install --frozen-lockfile --ignore-scripts
            bun run check
          '
      - name: Verify checks leave files unchanged
        run: git diff --exit-code
